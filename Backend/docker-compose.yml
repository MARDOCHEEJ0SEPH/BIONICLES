version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bionicles-postgres
    environment:
      POSTGRES_DB: bionicles
      POSTGRES_USER: bionicles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionicles"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bionicles-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bionicles-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bionicles-network

  # Rust Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bionicles-backend
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DATABASE_URL=postgresql://bionicles:${POSTGRES_PASSWORD:-changeme}@postgres:5432/bionicles
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - ETHEREUM_RPC_URL=${ETHEREUM_RPC_URL:-https://mainnet.infura.io/v3/your-key}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-https://polygon-rpc.com}
      - PAYMENT_WALLET_ADDRESS=${PAYMENT_WALLET_ADDRESS:-0x0000000000000000000000000000000000000000}
      - PAYMENT_WALLET_PRIVATE_KEY=${PAYMENT_WALLET_PRIVATE_KEY}
      - RUST_LOG=info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bionicles-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bionicles-network:
    driver: bridge
